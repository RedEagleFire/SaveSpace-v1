name: Windows release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "1.0.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:RELEASE_TAG -replace "^v", ""
            if ($version -notmatch "^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$") {
              throw "Release tag must be vMAJOR.MINOR.PATCH (optionally with a prerelease suffix)."
            }
          }

          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          dotnet publish .\SaveSpace.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output .\artifacts\package `
            "-p:Version=$version" `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

      - name: Add WebView2 Runtime installer and instructions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = ".\artifacts\package"
          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile (Join-Path $package "WebView2RuntimeInstaller.exe")
          Copy-Item .\README-Windows.txt $package
          Compress-Archive -Path "$package\*" `
            -DestinationPath .\artifacts\SaveSpace-windows-x64.zip `
            -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaveSpace-windows-x64
          path: .\artifacts\SaveSpace-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: SaveSpace-windows-x64
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/SaveSpace-windows-x64.zip \
            --title "SaveSpace $RELEASE_TAG" \
            --generate-notes
